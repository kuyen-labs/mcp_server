name: Build and Release

on:
  push:
    branches: [main, beta, alpha]
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  notify-workflow-start:
    name: Release.NotifyStart
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Notify
        uses: ./.github/actions/slack-notify-status
        with:
          webhook_url: ${{ vars.SLACK_WEBHOOK_URL }}
          title: '[:package: *@fuul/mcp-server*] ${{ github.workflow }} (${{ github.run_number }}): :large_yellow_circle: *STARTED*'

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [notify-workflow-start]
    if: always() && (needs.notify-workflow-start.result == 'success' || needs.notify-workflow-start.result == 'skipped')

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:ci

      # Filename must match npm Trusted Publishing: e.g. .github/workflows/release.yml (not fuul-sdk's versioning.yml).
      - name: Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release

  notify-workflow-success:
    name: Release.NotifySuccess
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.release.result == 'success'
    needs: [release]
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Notify
        uses: ./.github/actions/slack-notify-status
        with:
          webhook_url: ${{ vars.SLACK_WEBHOOK_URL }}
          title: '[:package: *@fuul/mcp-server*] ${{ github.workflow }} (${{ github.run_number }}): :large_green_circle: *SUCCESS*'

  notify-workflow-failure:
    name: Release.NotifyFailure
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.release.result == 'failure'
    needs: [release]
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Notify
        uses: ./.github/actions/slack-notify-status
        with:
          webhook_url: ${{ vars.SLACK_WEBHOOK_URL }}
          title: '[:package: *@fuul/mcp-server*] ${{ github.workflow }} (${{ github.run_number }}): :red_circle: *FAILURE*'

  notify-workflow-cancellation:
    name: Release.NotifyCancellation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.release.result == 'cancelled'
    needs: [release]
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Notify
        uses: ./.github/actions/slack-notify-status
        with:
          webhook_url: ${{ vars.SLACK_WEBHOOK_URL }}
          title: '[:package: *@fuul/mcp-server*] ${{ github.workflow }} (${{ github.run_number }}): :x: *CANCELLED*'
